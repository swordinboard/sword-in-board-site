<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 122" role="img" aria-label="Pinhold">
  <title>Pinhold</title>
  <!--
    A notice pinned to a crenellated wall: the pin and the hold, which is the
    whole name in one picture.

    No letterforms anywhere, on purpose. The old mark drew two B's, so it went
    wrong the moment the product stopped being called Borough Boards. Nothing
    here encodes an initial, so a future rename costs the artwork nothing.

    Everything is on a 2px grid at this size and no stroke is thinner than 3,
    which is what lets the same drawing survive being shrunk.
  -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- The wall. Merlons 16 wide, crenels 10, five across an even 120. -->
    <path
      d="M 12 114 V 30 H 28 V 46 H 38 V 30 H 54 V 46 H 64 V 30 H 80 V 46 H 90 V 30 H 106 V 46 H 116 V 30 H 132 V 114 Z"
      fill="#8b5e34"
      stroke="#4a2f18"
      stroke-width="4"
    />

    <!-- Courses, to read as stone rather than a solid block. -->
    <g stroke="#6b4526" stroke-width="2.5" opacity="0.55">
      <path d="M 12 62 H 132" />
      <path d="M 12 88 H 132" />
      <path d="M 46 62 V 88" />
      <path d="M 98 62 V 88" />
    </g>

    <!-- The notice, hung slightly askew the way a real one is. -->
    <g transform="rotate(-4 72 78)">
      <rect
        x="47" y="54" width="50" height="46" rx="3"
        fill="#f8f4e8"
        stroke="#a9793f"
        stroke-width="3"
      />
      <g stroke="#c2a982" stroke-width="3" opacity="0.85">
        <path d="M 57 76 H 87" />
        <path d="M 57 86 H 79" />
      </g>
    </g>

    <!-- The pin, holding it. -->
    <path d="M 70 60 V 70" stroke="#5c1f14" stroke-width="3.5" />
    <circle cx="70" cy="55" r="9" fill="#b8432f" stroke="#5c1f14" stroke-width="3" />
    <circle cx="66.5" cy="51.5" r="2.6" fill="#e8917f" />
  </g>
</svg>
