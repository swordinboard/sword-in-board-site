<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 122" role="img" aria-label="Borough Boards">
  <title>Borough Boards</title>
  <!--
    Two B's with cards rising from behind them.
    The B's face the same way on purpose. Mirroring them was the prettier idea,
    but at any real stroke weight the two sets of bowls meet in the middle and
    the pair reads as one blob - or, at small sizes, as a moth. Legibility wins.
    No box outline either: the cards already say "a place that holds boards",
    and drawing the container as well made the whole thing read as a paper bag.
  -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Cards, behind and lighter. Straight-edged so they read as boards. -->
    <g stroke="#a9793f" stroke-width="5">
      <rect x="24" y="18" width="30" height="36" rx="3" transform="rotate(-9 39 36)" fill="#f6f1e3" />
      <rect x="55" y="10" width="30" height="42" rx="3" transform="rotate(1 70 31)" fill="#f8f4e8" />
      <rect x="86" y="20" width="30" height="36" rx="3" transform="rotate(10 101 38)" fill="#f6f1e3" />
    </g>

    <!-- The letters, heavy, so the eye lands here first. -->
    <g stroke="#3f2713" stroke-width="13">
      <path d="M 26 50 V 110" />
      <path d="M 26 50 H 42 A 15 15 0 0 1 42 80 H 26" />
      <path d="M 26 80 H 44 A 15 15 0 0 1 44 110 H 26" />

      <path d="M 82 50 V 110" />
      <path d="M 82 50 H 98 A 15 15 0 0 1 98 80 H 82" />
      <path d="M 82 80 H 100 A 15 15 0 0 1 100 110 H 82" />
    </g>
  </g>
</svg>
