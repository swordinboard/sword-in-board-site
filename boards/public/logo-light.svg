<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 122" role="img" aria-label="Borough Boards">
  <title>Borough Boards</title>
  <!--
    The dark-background variant, used in the app itself.
    Same drawing as logo.svg with the tones swapped rather than merely
    lightened: the letters take the brightest value so they still arrive first,
    and the cards drop to mid-brown so the two do not dissolve into each other.
  -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#c9a06a" stroke-width="5">
      <rect x="24" y="18" width="30" height="36" rx="3" transform="rotate(-9 39 36)" fill="#7a5230" />
      <rect x="55" y="10" width="30" height="42" rx="3" transform="rotate(1 70 31)" fill="#8b5e34" />
      <rect x="86" y="20" width="30" height="36" rx="3" transform="rotate(10 101 38)" fill="#7a5230" />
    </g>

    <g stroke="#f5efe0" stroke-width="13">
      <path d="M 26 50 V 110" />
      <path d="M 26 50 H 42 A 15 15 0 0 1 42 80 H 26" />
      <path d="M 26 80 H 44 A 15 15 0 0 1 44 110 H 26" />

      <path d="M 82 50 V 110" />
      <path d="M 82 50 H 98 A 15 15 0 0 1 98 80 H 82" />
      <path d="M 82 80 H 100 A 15 15 0 0 1 100 110 H 82" />
    </g>
  </g>
</svg>
