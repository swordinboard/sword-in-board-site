<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 122" role="img" aria-label="Pinhold">
  <title>Pinhold</title>
  <!--
    The dark-background variant, used in the app itself.
    Same drawing as logo.svg with the tones swapped rather than merely
    lightened: the notice keeps the brightest value so it still arrives first,
    and the wall lifts to mid-brown with a light outline so its silhouette does
    not dissolve into a dark panel.
  -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path
      d="M 12 114 V 30 H 28 V 46 H 38 V 30 H 54 V 46 H 64 V 30 H 80 V 46 H 90 V 30 H 106 V 46 H 116 V 30 H 132 V 114 Z"
      fill="#7a5230"
      stroke="#c9a06a"
      stroke-width="4"
    />

    <g stroke="#a9793f" stroke-width="2.5" opacity="0.7">
      <path d="M 12 62 H 132" />
      <path d="M 12 88 H 132" />
      <path d="M 46 62 V 88" />
      <path d="M 98 62 V 88" />
    </g>

    <g transform="rotate(-4 72 78)">
      <rect
        x="47" y="54" width="50" height="46" rx="3"
        fill="#f5efe0"
        stroke="#c9a06a"
        stroke-width="3"
      />
      <g stroke="#b8a184" stroke-width="3" opacity="0.85">
        <path d="M 57 76 H 87" />
        <path d="M 57 86 H 79" />
      </g>
    </g>

    <path d="M 70 60 V 70" stroke="#3d140d" stroke-width="3.5" />
    <circle cx="70" cy="55" r="9" fill="#d2503a" stroke="#3d140d" stroke-width="3" />
    <circle cx="66.5" cy="51.5" r="2.6" fill="#f5b3a4" />
  </g>
</svg>
