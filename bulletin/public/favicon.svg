<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Borough Boards">
  <title>Borough Boards</title>
  <!--
    The small mark. A browser tab is 16px, which is eight pixels per letter for
    a two-letter monogram - not enough for anything to survive. So this carries
    one B and one card, at weights nothing thinner than 3px at 64.
  -->
  <rect width="64" height="64" rx="14" fill="#8b5e34" />
  <rect x="37" y="6" width="17" height="19" rx="3" fill="#f1e9d8" transform="rotate(9 45 15)" />
  <g fill="none" stroke="#f8f4e8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 22 21 V 53" />
    <path d="M 22 21 H 32 A 8 8 0 0 1 32 37 H 22" />
    <path d="M 22 37 H 34 A 8 8 0 0 1 34 53 H 22" />
  </g>
</svg>
